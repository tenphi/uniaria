<form id="order" novalidate>
  <uni-field id="country-field" required>
    <div data-uni="field">
      <label data-element="Label"
        >Country <span aria-hidden="true">*</span></label
      >
      <select data-element="Control" id="country" name="country">
        <option value="">Choose a country</option>
        <option value="de">Germany</option>
        <option value="fr">France</option>
        <option value="jp">Japan</option>
      </select>
      <p data-element="Description">We ship your order there.</p>
      <p data-element="Error" hidden>Choose a country.</p>
    </div>
  </uni-field>

  <uni-checkbox id="terms" required>
    <div data-uni="checkbox">
      <label data-element="Wrapper">
        <input data-element="Input" type="checkbox" name="terms" />
        <span data-element="Indicator"></span>
        <span data-element="Label">I accept the terms</span>
      </label>
      <p data-element="Error" hidden>Accept the terms to continue.</p>
    </div>
  </uni-checkbox>

  <uni-button type="submit">
    <button data-uni="button" data-variant="primary">Order</button>
  </uni-button>
</form>
<output id="log">Submit the form empty to see the errors.</output>
