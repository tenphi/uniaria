<div class="list">
  <uni-switch>
    <label class="uni-switch">
      <span data-element="Label">Wi-Fi</span>
      <input data-element="Input" type="checkbox" name="wifi" checked />
      <span data-element="Indicator"><span data-element="Thumb"></span></span>
    </label>
  </uni-switch>
  <uni-switch>
    <label class="uni-switch">
      <span data-element="Label">Bluetooth</span>
      <input data-element="Input" type="checkbox" name="bluetooth" />
      <span data-element="Indicator"><span data-element="Thumb"></span></span>
    </label>
  </uni-switch>
  <uni-switch>
    <div class="uni-switch">
      <label data-element="Wrapper">
        <span data-element="Label">Low power mode</span>
        <input data-element="Input" type="checkbox" name="low-power" />
        <span data-element="Indicator"><span data-element="Thumb"></span></span>
      </label>
      <p data-element="Description">Fetches mail less often.</p>
    </div>
  </uni-switch>
  <uni-switch disabled>
    <label class="uni-switch">
      <span data-element="Label">Airplane mode</span>
      <input data-element="Input" type="checkbox" name="airplane" />
      <span data-element="Indicator"><span data-element="Thumb"></span></span>
    </label>
  </uni-switch>
</div>
<output id="log">Flip a switch with the mouse, Space or a tap.</output>
