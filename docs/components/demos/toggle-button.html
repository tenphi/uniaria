<div class="row">
  <uni-toggle-button>
    <button data-uni="toggle-button">Bold</button>
  </uni-toggle-button>
  <uni-toggle-button default-selected>
    <button data-uni="toggle-button" aria-pressed="true">Italic</button>
  </uni-toggle-button>
  <uni-toggle-button>
    <button data-uni="toggle-button">Underline</button>
  </uni-toggle-button>
  <uni-toggle-button disabled>
    <button data-uni="toggle-button">Strikethrough</button>
  </uni-toggle-button>
</div>
<p id="sample" class="italic">The quick brown fox jumps over the lazy dog.</p>
<output id="log">Toggle a style with the mouse, a key or a tap.</output>
