<uni-dialog>
  <button data-element="Trigger">Delete file…</button>
  <dialog class="uni-dialog">
    <h2 data-element="Title">Delete “report.pdf”?</h2>
    <p data-element="Description">It stays in the trash for 30 days.</p>
    <div class="actions">
      <button data-element="Close">Cancel</button>
      <uni-button id="delete">
        <button class="uni-button primary">Delete</button>
      </uni-button>
    </div>
  </dialog>
</uni-dialog>
<output id="log">Close it with Escape, the backdrop or a button.</output>
