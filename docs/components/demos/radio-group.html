<uni-radio-group name="plan">
  <div data-uni="radio-group">
    <span data-element="Label">Plan</span>
    <span data-element="Description"
      >Billed monthly. Change it at any time.</span
    >
    <uni-radio value="free">
      <label data-uni="radio">
        <input data-element="Input" type="radio" />
        <span data-element="Indicator"></span>
        <span data-element="Label">Free</span>
      </label>
    </uni-radio>
    <uni-radio value="pro">
      <label data-uni="radio">
        <input data-element="Input" type="radio" checked />
        <span data-element="Indicator"></span>
        <span data-element="Label">Pro</span>
      </label>
    </uni-radio>
    <uni-radio value="team">
      <label data-uni="radio">
        <input data-element="Input" type="radio" />
        <span data-element="Indicator"></span>
        <span data-element="Label">Team</span>
      </label>
    </uni-radio>
    <uni-radio value="enterprise" disabled>
      <label data-uni="radio">
        <input data-element="Input" type="radio" />
        <span data-element="Indicator"></span>
        <span data-element="Label">Enterprise</span>
      </label>
    </uni-radio>
  </div>
</uni-radio-group>
<output id="log">Pick a plan with the mouse or the arrow keys.</output>
