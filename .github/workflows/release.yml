name: Release

# Run by hand from the Actions tab (`gh workflow run release.yml`), so
# nothing reaches npm without the owner. With changesets in `.changeset/`,
# a run opens or updates the "chore: version packages" pull request; once
# it is merged, the next run publishes the versions it set, tags them and
# creates their GitHub releases. Publishing uses npm trusted publishing
# (OIDC): each package's settings on npmjs.com name this workflow and the
# `release` environment.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # The Playwright the repository installs, read as ci.yml's `changes` job
  # reads it: the root importer's `playwright` in the lockfile.
  playwright:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.playwright.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Playwright version
        id: playwright
        run: |
          version=$(awk '
            /^  \.:$/ { root = 1; next }
            /^  [^ ]/ { root = 0 }
            root && /^      playwright:$/ { found = 1; next }
            found && /^        version:/ { print $2; exit }
          ' pnpm-lock.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: playwright
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # CI's image for its browser jobs (ci.yml), where the screenshot
    # references are made: the browsers and their system libraries come with
    # it, so nothing is downloaded from a package mirror, which timed this
    # job out twice on 2026-10-26. User 1001 is the runner's, which owns the
    # workspace and `$HOME`; Firefox refuses to run as root there.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --init --ipc=host --user 1001
    timeout-minutes: 30
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      # Node 24, not CI's 22: trusted publishing needs npm 11.5.1 or later,
      # which Node 24 ships. Don't upgrade npm in place on a hosted runner.
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # What CI checks, again on the commit being released.
      - name: Check
        run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm build && pnpm test

      - name: Clear the npm token, for OIDC
        run: npm config delete //registry.npmjs.org/:_authToken || true

      - name: Create the version pull request, or publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # One release for the version, below, not one per package.
          create-github-releases: false
        env:
          # npm makes provenance only from a public repository.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}

      # One version for every package (the `fixed` group), so one release.
      - name: Create the GitHub release
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const [first] = JSON.parse(
              process.env.PUBLISHED_PACKAGES,
            );
            const tag = `v${first.version}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              prerelease: first.version.startsWith('0.'),
            });
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
