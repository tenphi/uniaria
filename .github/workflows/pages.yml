name: Deploy documentation

# Run by hand from the Actions tab (`gh workflow run pages.yml`), on `main`:
# it builds the site in `apps/docs` with the checks CI runs, publishes it to
# GitHub Pages at https://uniaria.tenphi.me (the custom domain is set in the
# repository's Pages settings), then checks the deployed pages and assets.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        run: pnpm -C apps/docs validate

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same build, checked against what the deployment serves.
      - name: Check the deployed site
        run: |
          pnpm -C apps/docs build
          pnpm -C apps/docs exec cookbook check-build --url https://uniaria.tenphi.me/
