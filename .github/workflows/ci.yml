name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  ci:
    # Label changes only matter to the conformance check below.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    # The Ubuntu of Playwright's Docker image, where the screenshot references
    # are made (packages/styles/scripts/screenshots.sh): not `ubuntu-latest`,
    # which moves on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `browser` Vitest project runs in Chromium, Firefox and WebKit. The
      # binaries are cached and keyed on the lockfile, so a Playwright bump
      # pulls matching browsers, and on the runner image (`ImageOS`, such as
      # `ubuntu24`): Playwright builds them per Ubuntu release, and a WebKit
      # built for one doesn't start on another.
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # System libraries live outside the cached directory, so they are
      # reinstalled even when the browsers themselves were restored.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # A screenshot that no longer matches its reference leaves the actual
      # and diff images in Vitest's attachments (packages/styles/spec.md →
      # Testing → Screenshots).
      - name: Upload failed screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failed-screenshots
          path: .vitest/attachments
          if-no-files-found: ignore
          retention-days: 7

  # The documentation site (apps/docs): type check, Cookbook's content and
  # link checks, the production build with its demo bundles, and the built
  # output's checks. The owner publishes it by hand (pages.yml).
  docs:
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        run: pnpm -C apps/docs validate

  # Conformance scenarios and implementation never change in the same commit
  # or pull request (AGENTS.md → Conformance). On pull requests it re-runs
  # when labels change, so the owner's `conformance-approved` label takes
  # effect without a new push.
  conformance-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check each pushed commit
        if: github.event_name == 'push'
        run: node scripts/check-conformance-separation.mjs
        env:
          COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}

      - name: Check the pull request
        if: github.event_name == 'pull_request'
        run: node scripts/check-conformance-separation.mjs
        env:
          PR_BASE: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
