name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new push to a pull request cancels the run for its previous commit. Label
# changes get a group of their own, so adding `conformance-approved` never
# cancels the tests, and pushes to main never cancel anything.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'labels' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, format check, type check, build and the DOM-free tests (the `node`
  # Vitest project).
  checks:
    # Label changes only matter to the conformance check below.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:node

  # Whether the browser tests run: a pull request that changes only `docs/`,
  # Markdown or changesets can't change what they test, since no test reads
  # those files. The docs job still checks the site. Also the Playwright the
  # repository installs, whose Docker image the browser jobs run in.
  changes:
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.check.outputs.browser }}
      playwright: ${{ steps.playwright.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The file list goes to grep as a string, not through a pipe: with
      # `pipefail`, `grep -q` stopping early could fail `git diff` and the
      # check with it.
      - name: Check for changes outside the docs
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: origin/${{ github.base_ref }}
        run: |
          browser=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$PR_BASE...HEAD")
            if ! grep -qvE '^docs/|\.md$|^\.changeset/' <<< "$changed"; then
              browser=false
            fi
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

      # The root importer's `playwright` in the lockfile, the version
      # `node_modules/playwright` holds after an install, as
      # packages/styles/scripts/screenshots.sh reads it.
      - name: Playwright version
        id: playwright
        run: |
          version=$(awk '
            /^  \.:$/ { root = 1; next }
            /^  [^ ]/ { root = 0 }
            root && /^      playwright:$/ { found = 1; next }
            found && /^        version:/ { print $2; exit }
          ' pnpm-lock.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The `browser` Vitest project, one job per engine, side by side. Firefox
  # runs its files one at a time (vitest.config.ts), so it is split in four:
  # each adapter's conformance file, which take most of its time, and the
  # rest. Files are picked by name rather than with `--shard`, which assigns
  # them by path hash and could put two conformance files in one job.
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: browser (${{ matrix.id }})
    runs-on: ubuntu-latest
    # Playwright's Docker image for the installed Playwright: the browsers
    # and their system libraries come with it, so nothing is downloaded from
    # a package mirror, and the screenshot references are made in the same
    # image (packages/styles/scripts/screenshots.sh). Its options are that
    # script's; user 1001 is the runner's, which owns the workspace and
    # `$HOME`, and Firefox refuses to run as root there.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --init --ipc=host --user 1001
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: chromium
            browser: chromium
          - id: webkit
            browser: webkit
          - id: firefox-elements
            browser: firefox
            files: packages/elements/src/conformance.browser.test.ts
          - id: firefox-react
            browser: firefox
            files: packages/react/src/conformance.browser.test.ts
          - id: firefox-vue
            browser: firefox
            files: packages/vue/src/conformance.browser.test.ts
          # Excludes the three files by name, so a new adapter's conformance
          # file runs here rather than nowhere.
          - id: firefox-rest
            browser: firefox
            files: --exclude 'packages/{elements,react,vue}/src/conformance.browser.test.ts'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm vitest run --project "browser (${{ matrix.browser }})" ${{ matrix.files }}

      # A screenshot that no longer matches its reference leaves the actual
      # and diff images in Vitest's attachments (packages/styles/spec.md →
      # Testing → Screenshots).
      - name: Upload failed screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failed-screenshots-${{ matrix.id }}
          path: .vitest/attachments
          if-no-files-found: ignore
          retention-days: 7

  # The documentation site (apps/docs): type check, Cookbook's content and
  # link checks, the production build with its demo bundles, and the built
  # output's checks. The owner publishes it by hand (pages.yml).
  docs:
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        run: pnpm -C apps/docs validate

  # Conformance scenarios and implementation never change in the same commit
  # or pull request (AGENTS.md → Conformance). On pull requests it re-runs
  # when labels change, so the owner's `conformance-approved` label takes
  # effect without a new push.
  conformance-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check each pushed commit
        if: github.event_name == 'push'
        run: node scripts/check-conformance-separation.mjs
        env:
          COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}

      - name: Check the pull request
        if: github.event_name == 'pull_request'
        run: node scripts/check-conformance-separation.mjs
        env:
          PR_BASE: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
