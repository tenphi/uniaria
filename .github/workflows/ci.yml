name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  ci:
    # Label changes only matter to the conformance check below.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `browser` Vitest project runs in Chromium, Firefox and WebKit. The
      # binaries are cached and keyed on the lockfile, so a Playwright bump
      # pulls matching browsers.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # System libraries live outside the cached directory, so they are
      # reinstalled even when the browsers themselves were restored.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Conformance scenarios and implementation never change in the same commit
  # or pull request (AGENTS.md → Conformance). On pull requests it re-runs
  # when labels change, so the owner's `conformance-approved` label takes
  # effect without a new push.
  conformance-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check each pushed commit
        if: github.event_name == 'push'
        run: node scripts/check-conformance-separation.mjs
        env:
          COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}

      - name: Check the pull request
        if: github.event_name == 'pull_request'
        run: node scripts/check-conformance-separation.mjs
        env:
          PR_BASE: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
