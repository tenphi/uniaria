version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # Major versions only by hand, when there is a reason (owner, 2026-10-15):
    # the packages must keep working with older toolchains, such as SSR on
    # older React and Node, and `@types/node` follows the oldest Node we
    # support.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vitest:
        patterns: ['vitest', '@vitest/*', 'playwright']
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint']
      changesets:
        patterns: ['@changesets/*']
      dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
