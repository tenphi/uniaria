version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # Major versions of the packages that set what we support come only by
    # hand (owner, 2026-10-15): `@types/node` follows the oldest Node in
    # `engines`, React stays in sous-react's peer range, TypeScript in what
    # consumers and typescript-eslint support, and Vitest in sous-testing's
    # peer range. Other major versions still come as pull requests.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vitest:
        patterns: ['vitest', '@vitest/*', 'playwright']
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint']
      changesets:
        patterns: ['@changesets/*']
      dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
